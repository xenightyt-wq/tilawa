# Publie la PWA sur GitHub Pages à chaque push sur main.
# Le site compilé est poussé sur la branche gh-pages : GitHub active alors
# Pages automatiquement (aucun réglage manuel nécessaire).
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Tests unitaires
        run: npm test
        working-directory: frontend
      - name: Compilation (sous-dossier = nom du dépôt)
        run: npm run build
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Publication sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          force_orphan: true
