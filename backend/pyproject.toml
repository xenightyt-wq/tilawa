[project]
name = "quran-recitation-backend"
version = "0.1.0"
description = "Serveur de reconnaissance vocale (Whisper affiné Coran) en streaming WebSocket"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "faster-whisper>=1.1",
  "numpy>=1.26",
  # faster-whisper 1.2 utilise un argument retiré de PyAV 16
  "av>=12,<16",
]

[project.optional-dependencies]
# Bibliothèques CUDA 12 / cuDNN 9 pour CTranslate2 (GPU NVIDIA)
cuda = ["nvidia-cublas-cu12>=12.4,<12.5", "nvidia-cudnn-cu12>=9.1,<10"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
# Conversion des modèles Hugging Face → CTranslate2 (une seule fois)
convert = ["ctranslate2>=4.4", "transformers>=4.40,<5", "torch>=2.2", "optimum-onnx[onnxruntime]>=0.0.1", "accelerate>=1.0", "onnxconverter-common>=1.14", "onnx-ir>=0.1"]

[tool.uv]
default-groups = ["dev"]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
